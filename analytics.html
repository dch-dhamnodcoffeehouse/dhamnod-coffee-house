<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCH Analytics</title>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#83977c">

<style>

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial;
}

.title{
    font-size:2rem;
    font-weight:bold;
    margin-bottom:25px;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1d1d1d;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.card-title{
    font-size:1rem;
    color:#bbb;
    margin-bottom:10px;
}

.card-value{
    font-size:2rem;
    font-weight:bold;
}

.green{
    color:#2ecc71;
}

.orange{
    color:#f39c12;
}

.blue{
    color:#3498db;
}

.red{
    color:#e74c3c;
}

.items-box{
    margin-top:30px;
    background:#1d1d1d;
    padding:25px;
    border-radius:18px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #333;
}

.section{
    margin-top:35px;
}

.order-box{
    background:#1d1d1d;
    padding:18px;
    border-radius:16px;
    margin-bottom:15px;
}

.order-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-weight:bold;
}

.order-status{
    padding:6px 12px;
    border-radius:8px;
    font-size:0.9rem;
}

.pending{
    background:orange;
    color:black;
}

.preparing{
    background:#3498db;
}

.ready{
    background:#2ecc71;
}

.completed{
    background:#777;
}

.order-items{
    color:#ccc;
    margin-top:10px;
    line-height:1.8;
}

@media(max-width:768px){

body{
    padding:14px;
}

.card-value{
    font-size:1.6rem;
}

}

</style>

</head>

<body>

<div id="loginScreen" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#111;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
">

<div style="
background:#1d1d1d;
padding:30px;
border-radius:20px;
width:90%;
max-width:380px;
">

<h1 style="
text-align:center;
margin-bottom:25px;
color:white;
">
🔐 DCH Analytics Login
</h1>

<input
id="adminUser"
type="text"
placeholder="Username"
style="
width:100%;
padding:14px;
margin-bottom:15px;
border:none;
border-radius:12px;
"
>

<input
id="adminPass"
type="password"
placeholder="Password"
style="
width:100%;
padding:14px;
margin-bottom:20px;
border:none;
border-radius:12px;
"
>

<button
onclick="loginAdmin()"
style="
width:100%;
padding:14px;
background:#2ecc71;
color:white;
border:none;
border-radius:12px;
font-weight:bold;
"
>
Login
</button>

<p id="loginError" style="
color:red;
text-align:center;
display:none;
margin-top:10px;
">
Wrong Username or Password
</p>

</div>

</div>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:10px;
">

<div class="title">
📊 DCH Cafe Analytics
</div>

<button
onclick="logoutAdmin()"
style="
background:#e74c3c;
color:white;
border:none;
padding:10px 16px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
">
🚪 Logout
</button>

</div>

<div class="stats-grid">

<div class="card">
<div class="card-title">
Total Revenue
</div>
<div class="card-value green" id="revenue">
₹0
</div>
</div>

<div class="card">
<div class="card-title">
Total Orders
</div>
<div class="card-value blue" id="orders">
0
</div>
</div>

<div class="card">
<div class="card-title">
Active Orders
</div>
<div class="card-value orange" id="pending">
0
</div>
</div>

<div class="card">
<div class="card-title">
Completed Orders
</div>
<div class="card-value red" id="completed">
0
</div>
</div>

</div>

<div class="items-box">

<h2>
🔥 Top Selling Items
</h2>

<div id="topItems">

No data yet

</div>

</div>

<div class="section">

<h2>
🧾 Recent Orders
</h2>

<div id="recentOrders">

No recent orders

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyALDwRVTLuTV12PYnk1HF5eg-sztH2Bb0s",

authDomain: "dashboard-dch-a9904.firebaseapp.com",

databaseURL: "https://dashboard-dch-a9904-default-rtdb.firebaseio.com",

projectId: "dashboard-dch-a9904",

storageBucket: "dashboard-dch-a9904.firebasestorage.app",

messagingSenderId: "413889905968",

appId: "1:413889905968:web:747b9a22aa95536f9074f5"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const revenueEl = document.getElementById('revenue');

const ordersEl = document.getElementById('orders');

const pendingEl = document.getElementById('pending');

const completedEl = document.getElementById('completed');

const topItemsEl = document.getElementById('topItems');

const recentOrdersEl = document.getElementById('recentOrders');

const ordersRef = ref(db, 'orders');

onValue(ordersRef, (snapshot)=>{

const data = snapshot.val();

if(!data){

recentOrdersEl.innerHTML = "No orders found";

return;

}

let revenue = 0;

let totalOrders = 0;

let activeOrders = 0;

let completedOrders = 0;

let itemStats = {};

const ordersArray = Object.entries(data).reverse();

ordersArray.forEach(([id,order])=>{

totalOrders++;

revenue += Number(order.total || 0);

if(order.status === "Completed"){

completedOrders++;

}else{

activeOrders++;

}

if(order.items){

order.items.forEach(item=>{

if(!itemStats[item.name]){

itemStats[item.name] = 0;

}

itemStats[item.name] += item.quantity;

});

}

});

revenueEl.innerText = `₹${revenue}`;

ordersEl.innerText = totalOrders;

pendingEl.innerText = activeOrders;

completedEl.innerText = completedOrders;

const sortedItems = Object.entries(itemStats)
.sort((a,b)=>b[1]-a[1]);

topItemsEl.innerHTML = '';

sortedItems.slice(0,10).forEach(item=>{

topItemsEl.innerHTML += `

<div class="item">

<div>${item[0]}</div>

<div>${item[1]} sold</div>

</div>

`;

});

recentOrdersEl.innerHTML = '';

ordersArray.slice(0,10).forEach(([id,order])=>{

let statusClass = "pending";

if(order.status === "Preparing"){
statusClass = "preparing";
}

if(order.status === "Ready"){
statusClass = "ready";
}

if(order.status === "Completed"){
statusClass = "completed";
}

recentOrdersEl.innerHTML += `

<div class="order-box">

<div class="order-head">

<div>
#${order.token || id.slice(-4)}
</div>

<div class="order-status ${statusClass}">
${order.status || "Pending"}
</div>

</div>

<div>
👤 ${order.customer}
</div>

<div>
📞 ${order.phone || "No Number"}
</div>

<div>
🕒 ${order.time || "No Time"}
</div>

<div class="order-items">

${order.items.map(item =>
`• ${item.name} x${item.quantity}`
).join('<br>')}

</div>

<div style="margin-top:12px;font-weight:bold;color:#2ecc71;">

₹${order.total}

</div>

</div>

`;

});

}); 

</script>

<script>

const ADMIN_USERNAME = "dchdhamnod";

const ADMIN_PASSWORD = "dch71225";

function loginAdmin(){

const user = document.getElementById("adminUser").value;

const pass = document.getElementById("adminPass").value;

if(
user === ADMIN_USERNAME &&
pass === ADMIN_PASSWORD
){

localStorage.setItem("dchAnalyticsLoggedIn","true");

document.getElementById("loginScreen").style.display = "none";

}else{

document.getElementById("loginError").style.display = "block";

}

}

window.onload = function(){

const loggedIn = localStorage.getItem("dchAnalyticsLoggedIn");

if(loggedIn === "true"){

document.getElementById("loginScreen").style.display = "none";

}

};

function logoutAdmin(){

localStorage.removeItem("dchAnalyticsLoggedIn");

location.reload();

}

</script>
    <script>
if ('serviceWorker' in navigator) {

window.addEventListener('load', () => {

navigator.serviceWorker
.register('./service-worker.js')
.then(() => console.log('Service Worker Registered'))
.catch(err => console.log(err));

});

}
    </script>
    

</body>
</html>
