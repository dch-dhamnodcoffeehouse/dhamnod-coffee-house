<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCH Live Orders</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    flex-wrap:wrap;
    gap:10px;
}

.title{
    font-size:2rem;
    font-weight:bold;
}

.live{
    background:#ff3b3b;
    padding:8px 14px;
    border-radius:999px;
    font-weight:bold;
}

.sound-btn{
    background:#2ecc71;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.section-title{
    margin-top:35px;
    margin-bottom:20px;
    font-size:1.5rem;
    font-weight:bold;
}

.orders-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.order-card{
    background:#1d1d1d;
    border-radius:18px;
    padding:20px;
    border-left:6px solid orange;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.completed-card{
    border-left:6px solid #2ecc71;
    opacity:0.9;
}

.order-number{
    font-size:1.5rem;
    font-weight:bold;
    margin-bottom:10px;
    color:#ffd166;
}

.customer{
    color:#bbb;
    margin-bottom:15px;
    font-size:1rem;
    line-height:1.7;
}

.items{
    margin-bottom:18px;
    line-height:1.8;
    color:#f2f2f2;
}

.total{
    font-size:1.2rem;
    font-weight:bold;
    color:#8fff8f;
    margin-bottom:10px;
}

.time{
    color:#aaa;
    margin-bottom:15px;
    font-size:0.9rem;
}

.status{
    display:inline-block;
    padding:8px 14px;
    border-radius:10px;
    font-weight:bold;
    background:orange;
    color:black;
    margin-bottom:15px;
}

.empty{
    text-align:center;
    margin-top:40px;
    color:#aaa;
    font-size:1.2rem;
}

.popup{
    display:none;
    position:fixed;
    top:20px;
    right:20px;
    background:#2ecc71;
    color:white;
    padding:18px 22px;
    border-radius:14px;
    font-weight:bold;
    z-index:9999;
}

.action-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

.action-btn{
    flex:1;
    border:none;
    padding:10px;
    border-radius:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.preparing{
    background:#3498db;
}

.ready{
    background:#2ecc71;
}

.complete{
    background:#e74c3c;
}

</style>

</head>

<body>

<div class="popup" id="popup">
🔔 New Order Received
</div>

<div class="topbar">

<div class="title">
☕ DCH Live Orders
</div>

<div style="display:flex; gap:10px; align-items:center;">

<div class="live">
🔴 LIVE
</div>

<button class="sound-btn" onclick="enableSound()">
🔔 Enable Sound
</button>

<button class="sound-btn"
onclick="window.location.href='analytics.html'">
📊 Analytics
</button>

</div>

</div>

<div class="section-title">
🟠 Active Orders
</div>

<div class="orders-grid" id="activeOrders"></div>

<div class="section-title">
✅ Completed Orders
</div>

<div class="orders-grid" id="completedOrders"></div>

<audio id="orderSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2868/2868-preview.mp3" type="audio/mpeg">
</audio>

<script>

function enableSound(){

const sound = document.getElementById('orderSound');

sound.play();

alert("Sound Enabled ✅");

}

function showPopup(){

const popup = document.getElementById('popup');

popup.style.display = 'block';

setTimeout(()=>{
popup.style.display = 'none';
},3000);

}

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue,
update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const activeOrders = document.getElementById('activeOrders');

const completedOrders = document.getElementById('completedOrders');

const orderSound = document.getElementById('orderSound');

const ordersRef = ref(db, 'orders');

let previousCount = 0;

window.updateStatus = async function(orderId,status){

await update(ref(db, `orders/${orderId}`),{
status:status
});

}

window.completeOrder = async function(orderId){

await update(ref(db, `orders/${orderId}`),{
status:"Completed"
});

}

onValue(ordersRef, (snapshot) => {

activeOrders.innerHTML = '';

completedOrders.innerHTML = '';

const data = snapshot.val();

if(!data){

activeOrders.innerHTML = `
<div class="empty">
No orders yet
</div>
`;

return;

}

const ordersArray = Object.entries(data).reverse();

const activeList = [];
const completedList = [];

ordersArray.forEach(order => {

if(order[1].status === "Completed"){
completedList.push(order);
}else{
activeList.push(order);
}

});

if(activeList.length > previousCount){

orderSound.play();

showPopup();

}

previousCount = activeList.length;

const finalOrders = [...activeList, ...completedList];

finalOrders.forEach(([id, order]) => {

const isCompleted = order.status === "Completed";

const card = document.createElement('div');

card.className = isCompleted
? 'order-card completed-card'
: 'order-card';

card.innerHTML = `

<div class="order-number">
#${order.token || id.slice(-4)}
</div>

<div class="customer">
👤 ${order.customer}<br>
📞 ${order.phone || "No Number"}
</div>

<div class="items">
${order.items.map(item =>
`• ${item.name} x${item.quantity}`
).join('<br>')}
</div>

<div class="total">
₹${order.total}
</div>

<div class="time">
🕒 ${order.time || "No Time"}
</div>

<div class="status">
${order.status || "Pending"}
</div>

${!isCompleted ? `

<div class="action-buttons">

<button class="action-btn preparing"
onclick="updateStatus('${id}','Preparing')">
Preparing
</button>

<button class="action-btn ready"
onclick="updateStatus('${id}','Ready')">
Ready
</button>

<button class="action-btn complete"
onclick="completeOrder('${id}')">
Complete
</button>

</div>

` : ''}

`;

if(isCompleted){
completedOrders.appendChild(card);
}else{
activeOrders.appendChild(card);
}

});

});

</script>

</body>
</html>
